<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register</title></head>
<body>
<h2>Register New Account</h2>
<form th:action="@{/register}" th:object="${userDto}" method="post">

    <div><label>First Name:</label> <input type="text" th:field="*{firstName}"/></div>
    <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:red;"></div>

    <div><label>Last Name:</label> <input type="text" th:field="*{lastName}"/></div>
    <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:red;"></div>

    <div><label>Email:</label> <input type="email" th:field="*{email}"/></div>
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>

    <div><label>Username:</label> <input type="text" th:field="*{username}"/></div>
    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red;"></div>

    <div><label>Password:</label> <input type="password" th:field="*{password}"/></div>
    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></div>

    <div><label>Phone:</label> <input type="text" th:field="*{telNumber}"/></div>
    <div th:if="${#fields.hasErrors('telNumber')}" th:errors="*{telNumber}" style="color:red;"></div>

    <input type="hidden" th:field="*{role}" value="USER"/>

    <button type="submit">Register</button>
    <br>
    <a th:href="@{/login}">
        <button type="button" style="margin-top: 10px;">Back to Login</button>
    </a>
</form>
</body>
</html>
