<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Login</title></head>
<body>
<h2>Login to Library</h2>
<div th:if="${param.error}" style="color: red;">Invalid credentials.</div>
<div th:if="${param.logout}" style="color: green;">Logged out successfully.</div>
<div th:if="${param.registered}" style="color: green;">Registration successful! Please log in.</div>

<form th:action="@{/login}" method="post">
    <div><label>Username:</label> <input type="text" name="username" required/></div>
    <div><label>Password:</label> <input type="password" name="password" required/></div>
    <button type="submit">Log In</button>
</form>
<br>
<a th:href="@{/register}">
    <button type="button" style="margin-top: 15px;">Don't have an account? Register here</button>
</a>
</body>
</html>
